<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>模型展示</title>
<style>html,body{margin:0;height:100%;background:#9fd3f5;overflow:hidden}canvas{display:block}
#t{position:fixed;left:8px;top:6px;font:13px sans-serif;color:#234;background:#fffa;padding:3px 8px;border-radius:6px}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="t"></div>
<script type="module">
// 模型展示页：并排摆出建筑的各种风格和等级，方便检查建模效果。
// 用法：showcase.html（全部）、?style=cbd（一种风格的 0~5 级）、?style=cbd&level=3（单个特写）、&rot=角度（弧度）、&dist=镜头距离
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';
import { makeBuilding, lotMaterials } from './buildings.js';
import { makeTree, makeBush, makeRock, makeHill } from './nature.js';
import { THEMES } from './districts.js';
import { buildAirport, makePlane } from './sub-airport.js';
import { buildStadium } from './sub-stadium.js';
import { buildHarbor } from './sub-harbor.js';
import { buildSouth } from './sub-south.js';
import { buildPaddies, buildHillPavilion, buildTurbines } from './sub-scenery.js';

const q = new URLSearchParams(location.search);
const NATURE = q.get('nature');
const DISTRICT = q.get('district');
const SUB = q.get('sub');          // ?sub=airport：郊区的主角，单独看
const subTicks = [];   // ?district=old|cbd|beach|fun：街区中央的主题景观
const styles = (NATURE || DISTRICT || SUB) ? [] : q.get('style') ? [q.get('style')] : ['cbd', 'old', 'beach', 'fun'];
const levels = q.get('level') !== null ? [+q.get('level')] : [0, 1, 2, 3, 4, 5];
const color = q.get('color') || '#e8453c';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(+q.get('pr') || 2);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const skyCanvas = document.createElement('canvas'); skyCanvas.width = 4; skyCanvas.height = 256;
{
  const g = skyCanvas.getContext('2d'), grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#5fb4f2'); grad.addColorStop(0.65, '#a9dcfb'); grad.addColorStop(1, '#d9f1ff');
  g.fillStyle = grad; g.fillRect(0, 0, 4, 256);
}
const sky = new THREE.CanvasTexture(skyCanvas); sky.colorSpace = THREE.SRGBColorSpace;
scene.background = sky;
{
  const pm = new THREE.PMREMGenerator(renderer), e = sky.clone();
  e.mapping = THREE.EquirectangularReflectionMapping; e.needsUpdate = true;
  scene.environment = pm.fromEquirectangular(e).texture;
}
scene.add(new THREE.HemisphereLight('#ffffff', '#7a9a5a', 0.75));
const sun = new THREE.DirectionalLight('#fff4e0', 1.8);
sun.position.set(-18, 30, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 90 });
scene.add(sun);

const SP = 2.6;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: '#8fd16a', roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
styles.forEach((st, r) => levels.forEach((lv, c) => {
  const x = (c - (levels.length - 1) / 2) * SP, z = (r - (styles.length - 1) / 2) * SP;
  const lot = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 2), lotMaterials(st));
  lot.position.set(x, 0.05, z); lot.receiveShadow = true; scene.add(lot);
  const b = makeBuilding(st, lv, color);
  b.position.set(x, 0.1, z);
  b.rotation.y = +q.get('rot') || 0;
  scene.add(b);
}));

// ?nature=1：树、灌木、岩石、山丘排成一排
if (NATURE) {
  const items = [];
  for (let i = 0; i < 4; i++) items.push(makeTree('round', i));
  for (let i = 0; i < 3; i++) items.push(makeTree('pine', i));
  for (let i = 0; i < 3; i++) items.push(makeTree('palm', i));
  for (let i = 0; i < 3; i++) items.push(makeBush(i));
  for (let i = 0; i < 4; i++) items.push(makeRock(0.5, i));
  items.forEach((o, i) => { o.position.set((i - (items.length - 1) / 2) * 1.15, 0, 0); scene.add(o); });
  const h = makeHill(2.2, 1.6, 5); h.position.set(0, 0, -5); scene.add(h);
}
if (DISTRICT) {
  const dims = { old: [10, 4], cbd: [8, 4], beach: [8, 6], fun: [8, 6] }[DISTRICT];
  const th = THEMES.find(t => t.key === DISTRICT), g = new THREE.Group();
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(dims[0] + 1.6, dims[1] + 1.6), new THREE.MeshStandardMaterial({ color: '#d9cfa8', roughness: 0.95 }));
  pad.rotation.x = -Math.PI / 2; pad.position.y = 0.02; pad.receiveShadow = true; scene.add(pad);
  th.build(g, dims[0], dims[1], [], {});
  scene.add(g);
}
if (SUB === 'airport') {
  const g = new THREE.Group(); g.position.set(-10, 0, 13); scene.add(g);
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(26, 12), new THREE.MeshStandardMaterial({ color: '#8fd16a', roughness: 1 })); pad.rotation.x = -Math.PI / 2; pad.position.set(0.5, 0.005, 0); scene.add(pad);
  buildAirport(g, { rz: -15.025, rx0: 3, rx1: 17.125, IW: 22, ID: 18, ticks: subTicks });
}
if (SUB === 'stadium') { const pad = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({ color: '#8fd16a', roughness: 1 })); pad.rotation.x = -Math.PI / 2; pad.position.y = 0.005; scene.add(pad); buildStadium(scene, { x: 0, z: 0 }); }
if (SUB === 'harbor') {
  ground.visible = false;
  const g = new THREE.Group(); g.position.set(24, 0, -3.3); scene.add(g);
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: '#3fb6dd', roughness: 0.3 })); sea.rotation.x = -Math.PI / 2; sea.position.set(0, -0.75, 0); scene.add(sea);
  const isle = new THREE.Mesh(new THREE.BoxGeometry(8, 1, 14), new THREE.MeshStandardMaterial({ color: '#8fd16a' })); isle.position.set(5, -0.5, 0); scene.add(isle);
  buildHarbor(g, { IW: 22, ID: 18, ticks: subTicks });
}
if (SUB === 'south') {
  ground.visible = false;
  const g = new THREE.Group(); g.position.set(0, 0, -13.66); scene.add(g);
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(60, 12), new THREE.MeshStandardMaterial({ color: '#3fb6dd', roughness: 0.3 })); sea.rotation.x = -Math.PI / 2; sea.position.set(0, -0.2, 6.5); scene.add(sea);
  buildSouth(g, { z: 13.66, bandD: 4.125, ID: 18, ticks: subTicks });
}
if (SUB === 'scenery') {
  const g = new THREE.Group(); scene.add(g);
  buildPaddies(g, { x0: -5.5, x1: -0.3, z0: -1.2, z1: 2.5 });
  buildHillPavilion(g, { hx: 3.5, hz: 0.6, rng: Math.random });
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), new THREE.MeshStandardMaterial({ color: '#3fb6dd' })); sea.rotation.x = -Math.PI / 2; sea.position.set(0, -0.75, -9); scene.add(sea);
  buildTurbines(g, { IW: -4, ticks: subTicks });
  g.children.forEach(c => { if (c.position.z === -9 || c.position.z === -1) c.position.z -= 7; });
}
if (SUB === 'plane') { const p = makePlane('#e03131'); p.scale.setScalar(4); p.position.y = 1.0; p.rotation.y = 0.6; scene.add(p); }
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 400);
const single = levels.length === 1 && styles.length === 1;
const dist = +q.get('dist') || (NATURE ? 12 : 0) || (DISTRICT ? 15 : 0) || (SUB ? 15 : 0) || (single ? 9 : Math.max(levels.length * SP * 1.25, styles.length * SP * 2.2));
camera.position.set(0, dist * (single ? 0.5 : 0.62), dist);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, (DISTRICT || SUB) ? 0.3 : single ? 1.2 : 0.6, 0);
controls.update();

const clock = new THREE.Clock();
function loop() {
  const t = clock.getElapsedTime();
  scene.traverse(o => { if (o.userData.blink) o.material.opacity = 1; });
  subTicks.forEach(f => f(clock.elapsedTime, 0.016));
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
document.getElementById('t').textContent = styles.join(' / ') + '  levels ' + levels.join(',');
window.__ready = true;
</script>
</body>
</html>
